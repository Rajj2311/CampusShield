name: Build APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import os, json
          s = os.environ["GOOGLE_SERVICES_JSON"]
          obj, _ = json.JSONDecoder().raw_decode(s[s.index("{"):])
          with open("android/app/google-services.json", "w") as f:
              json.dump(obj, f)
          print("google-services.json OK, project:", obj["project_info"]["project_id"])
          PY

      - run: flutter pub get
      - run: flutter build apk --debug --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: chowkidar-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
